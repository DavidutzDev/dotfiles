# Point ssh at the systemd-managed ssh-agent, and prompt for passphrases
# with the ksshaskpass popup instead of the terminal.
# NOT gcr-ssh-askpass: it refuses to run unless spawned by gcr-ssh-agent
# (gates on GCR_SSH_ASKPASS_SOCKET), and gcr-ssh-agent has no -t timeout.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
SSH_ASKPASS=/usr/bin/ksshaskpass
SSH_ASKPASS_REQUIRE=prefer
